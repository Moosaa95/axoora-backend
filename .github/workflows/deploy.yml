name: Axoora Backend CI & Render Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests & Lint Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django Settings & System Health
        run: |
          python manage.py check

      - name: Run Django Unit Tests
        run: |
          python manage.py test

  deploy:
    name: Trigger Render Production Deployment
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render via Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "==> Triggering Render Deploy Hook..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$DEPLOY_HOOK")
            STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
            echo "==> Render API Response Status: $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "==> Render deployment successfully triggered!"
            else
              echo "::error::Render deploy hook returned status $STATUS"
              echo "$RESPONSE"
              exit 1
            fi
          else
            echo "==> RENDER_DEPLOY_HOOK_URL secret not set."
            echo "==> Note: If Render is connected via GitHub Webhook / Auto-Deploy, Render will auto-deploy on push to main."
          fi

